<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!--
      Static form declarations so Netlify's build-time scanner registers these
      forms. The real (React) forms POST url-encoded bodies to /__forms.html.
      Field names here MUST match the fields the React forms send.
    -->

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <form name="wholesale" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="wholesale" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="location" />
      <input type="text" name="interests" />
      <input type="text" name="volume" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
